[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ambilage"
version = "0.2.0"
description = "Ambient lighting cooperative image editing and retrieval evaluation"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["src*"]
exclude = ["src.tests*"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
addopts = "-q -p no:cacheprovider"
pythonpath = ["."]
